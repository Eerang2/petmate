<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Mate - 프로필</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=03c9e2b1fa3c84165e10759e6ac3e245&libraries=services"></script>
    <style>
        .profile-actions {
            text-align: center;
            margin-bottom: 24px;
        }
        .btn-chat-request {
            padding: 14px 40px;
            background: linear-gradient(135deg, #B8956A, #D4BC9A);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }
        .btn-chat-request:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(184, 149, 106, 0.4);
        }
        .btn-chat-request:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-mypage-link {
            display: inline-block;
            padding: 10px 24px;
            background: #f0e8dd;
            color: #7a6a56;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-mypage-link:hover { background: #e8ddd0; }

        .info-card {
            background: #fffdf9;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border: 1px solid #f0e8dd;
        }
        .info-row {
            display: flex;
            padding: 14px 0;
            border-bottom: 1px solid #f0e8dd;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label {
            width: 80px;
            font-weight: 700;
            color: #B8956A;
            font-size: 14px;
            flex-shrink: 0;
        }
        .info-value {
            flex: 1;
            font-size: 14px;
            color: #555;
        }

        .pet-photo-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .pet-photo-section img {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            object-fit: cover;
            border: 4px solid #D4A574;
        }

        .map-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            margin-top: 12px;
            border: 1px solid #e0d5c8;
        }

        @media (max-width: 768px) {
            .mypage-container { padding: 0 12px; margin: 20px auto; }
            .info-card { padding: 16px; }
            .btn-chat-request { padding: 12px 32px; font-size: 14px; }
            .map-container { height: 160px; }
            .pet-photo-section img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/main.html" class="logo">
            <span>🐾</span> Pet Mate
        </a>
        <nav class="nav">
            <a href="/community.html">커뮤니티</a>
            <a href="/matching.html">매칭 잡기</a>
            <a href="/chat.html">채팅</a>
            <a href="/mypage.html">마이페이지</a>
            <a href="#" onclick="logout()" style="color:#e53935;">로그아웃</a>
        </nav>
    </div>
</header>

<div class="mypage-container">
    <!-- Profile Header -->
    <div class="profile-header">
        <img id="profileImg" src="" alt="프로필">
        <h2><span id="userName">-</span><span id="gradeBadge" class="grade-badge"></span></h2>
        <p id="userAddress">-</p>
    </div>

    <!-- Actions -->
    <div class="profile-actions" id="profileActions"></div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('owner')">주인 정보</button>
        <button class="tab-btn" onclick="switchTab('pet')">펫 정보</button>
    </div>

    <!-- 주인 정보 탭 -->
    <div class="tab-content active" id="ownerTab">
        <div class="info-card">
            <div class="info-row">
                <span class="info-label">이름</span>
                <span class="info-value" id="infoName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">나이</span>
                <span class="info-value" id="infoAge">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">지역</span>
                <span class="info-value" id="infoAddress">-</span>
            </div>
            <div id="mapContainer" style="margin-top: 4px;"></div>
        </div>
    </div>

    <!-- 펫 정보 탭 -->
    <div class="tab-content" id="petTab">
        <div class="info-card">
            <div class="pet-photo-section">
                <img id="petImg" src="" alt="펫 사진">
            </div>
            <div class="info-row">
                <span class="info-label">종류</span>
                <span class="info-value" id="infoPetType">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">품종</span>
                <span class="info-value" id="infoPetBreed">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">성격</span>
                <span class="info-value" id="infoPersonality">-</span>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 Pet Mate. All rights reserved.</p>
</footer>

<script src="/js/common.js"></script>
<script>
    if (!isLoggedIn()) location.href = '/index.html';

    const userKey = getUserKey();
    const params = new URLSearchParams(location.search);
    const profileId = params.get('id');

    if (!profileId) {
        alert('잘못된 접근입니다.');
        history.back();
    }

    let profileMap;

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (tab === 'owner') {
            document.querySelector('.tab-btn:first-child').classList.add('active');
            document.getElementById('ownerTab').classList.add('active');
            setTimeout(() => { if (profileMap) profileMap.relayout(); }, 100);
        } else {
            document.querySelector('.tab-btn:last-child').classList.add('active');
            document.getElementById('petTab').classList.add('active');
        }
    }

    async function loadProfile() {
        try {
            const user = await apiCall('/api/user/' + profileId);

            // 프로필 헤더
            const profileImg = document.getElementById('profileImg');
            profileImg.src = user.profileImage || 'https://via.placeholder.com/100?text=No+Image';
            document.getElementById('userName').textContent = user.name || '-';
            document.getElementById('userAddress').textContent = user.address || '-';

            // 등급 테두리 & 배지
            const grade = user.grade || 'BRONZE';
            profileImg.classList.remove('grade-border-silver', 'grade-border-gold');
            const badgeEl = document.getElementById('gradeBadge');
            badgeEl.className = 'grade-badge';
            badgeEl.textContent = '';
            if (grade === 'SILVER') {
                profileImg.classList.add('grade-border-silver');
                badgeEl.classList.add('grade-badge-silver');
                badgeEl.textContent = '실버 집사';
            } else if (grade === 'GOLD') {
                profileImg.classList.add('grade-border-gold');
                badgeEl.classList.add('grade-badge-gold');
                badgeEl.textContent = '골드 집사';
            }

            // 액션 버튼 - 매칭 상태에 따라 분기
            const actionsEl = document.getElementById('profileActions');
            if (String(profileId) === String(userKey)) {
                actionsEl.innerHTML = '<a href="/mypage.html" class="btn-mypage-link">내 마이페이지로 이동</a>';
            } else {
                const statusRes = await apiCall('/api/match/status?userKey=' + userKey + '&targetId=' + profileId);
                const matchStatus = statusRes.status;
                if (matchStatus === 'ACCEPTED') {
                    // 이미 수락된 상태 → 버튼 없이 프로필만
                } else if (matchStatus === 'PENDING') {
                    actionsEl.innerHTML = '<button class="btn-chat-request" disabled style="background:#888;">요청 대기중</button>';
                } else {
                    actionsEl.innerHTML = '<button class="btn-chat-request" id="chatRequestBtn" onclick="sendChatRequest()">채팅 요청하기</button>';
                }
            }

            // 주인 정보
            document.getElementById('infoName').textContent = user.name || '-';
            document.getElementById('infoAge').textContent = user.age ? user.age + '세' : '-';
            document.getElementById('infoAddress').textContent = user.address || '-';

            // 지도
            if (user.latitude && user.longitude) {
                const mapEl = document.getElementById('mapContainer');
                mapEl.innerHTML = '<div id="profileMap" class="map-container"></div>';
                const center = new kakao.maps.LatLng(user.latitude, user.longitude);
                profileMap = new kakao.maps.Map(document.getElementById('profileMap'), {
                    center: center,
                    level: 4,
                    draggable: false,
                    scrollwheel: false,
                    disableDoubleClickZoom: true
                });
                new kakao.maps.Marker({ position: center, map: profileMap });
            }

            // 펫 정보
            const petImg = document.getElementById('petImg');
            petImg.src = user.petImage || 'https://via.placeholder.com/120?text=No+Image';
            document.getElementById('infoPetType').textContent = user.petType || '-';
            document.getElementById('infoPetBreed').textContent = user.petBreed || '-';
            document.getElementById('infoPersonality').textContent = user.personality || '-';

            // 페이지 타이틀
            document.title = (user.name || '프로필') + ' - Pet Mate';

        } catch (e) {
            console.error(e);
            alert('프로필을 불러올 수 없습니다.');
        }
    }

    async function sendChatRequest() {
        const btn = document.getElementById('chatRequestBtn');
        btn.disabled = true;
        btn.textContent = '요청 중...';

        try {
            const result = await apiCall('/api/match/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    senderId: parseInt(userKey),
                    receiverId: parseInt(profileId)
                })
            });

            if (result.success) {
                btn.textContent = '요청 완료!';
                btn.style.background = '#888';
            } else {
                btn.textContent = result.message || '요청 실패';
                setTimeout(() => {
                    btn.textContent = '채팅 요청하기';
                    btn.disabled = false;
                    btn.style.background = '';
                }, 2000);
            }
        } catch (e) {
            btn.textContent = '채팅 요청하기';
            btn.disabled = false;
        }
    }

    loadProfile();
</script>
</body>
</html>
