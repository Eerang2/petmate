<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Mate - 관리자 대시보드</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-layout { display: flex; min-height: calc(100vh - 64px - 60px); }
        .admin-sidebar { width: 220px; background: #fffdf9; border-right: 1px solid #f0e8dd; padding: 24px 0; flex-shrink: 0; }
        .admin-sidebar a { display: block; padding: 14px 24px; font-size: 15px; font-weight: 600; color: #7a6a56; text-decoration: none; transition: all 0.2s; }
        .admin-sidebar a:hover { background: #f7f2ec; color: #B8956A; }
        .admin-sidebar a.active { background: #f7f2ec; color: #B8956A; border-left: 3px solid #B8956A; }
        .admin-content { flex: 1; padding: 32px; max-width: 1100px; }
        .admin-content h2 { font-size: 22px; color: #5a4a3a; margin-bottom: 24px; }
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #fffdf9; border: 1px solid #f0e8dd; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .stat-card .label { font-size: 14px; color: #999; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 800; color: #5a4a3a; }
        .stat-card .sub { font-size: 13px; color: #B8956A; margin-top: 4px; }
        .period-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
        .period-btn { padding: 8px 20px; border: 2px solid #f0e8dd; background: #fff; border-radius: 20px; font-size: 14px; font-weight: 600; color: #7a6a56; cursor: pointer; transition: all 0.2s; }
        .period-btn.active { background: #B8956A; color: #fff; border-color: #B8956A; }
        .chart-container { background: #fffdf9; border-radius: 16px; border: 1px solid #f0e8dd; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .chart-container h3 { font-size: 16px; color: #5a4a3a; margin-bottom: 16px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .admin-header .admin-info { font-size: 14px; color: #999; }
        .admin-header .btn-logout { padding: 6px 16px; background: #e53935; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/admin-dashboard.html" class="logo"><span>🐾</span> Pet Mate Admin</a>
        <nav class="nav">
            <span id="adminName" style="color:#999;font-size:14px;margin-right:12px;"></span>
            <button onclick="adminLogout()" style="padding:6px 16px;background:#e53935;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;">로그아웃</button>
        </nav>
    </div>
</header>

<div class="admin-layout">
    <nav class="admin-sidebar">
        <a href="/admin-dashboard.html" class="active">대시보드</a>
        <a href="/admin-users.html">회원 관리</a>
        <a href="/admin-posts.html">게시판 관리</a>
        <a href="/admin.html">결제 관리</a>
        <a href="/admin-reports.html">신고 관리</a>
    </nav>

    <div class="admin-content">
        <h2>대시보드</h2>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="label">총 회원수</div>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="label">오늘 가입자</div>
                <div class="value" id="todaySignups">-</div>
            </div>
            <div class="stat-card">
                <div class="label">오늘 매칭</div>
                <div class="value" id="todayMatches">-</div>
            </div>
            <div class="stat-card">
                <div class="label">총 수익</div>
                <div class="value" id="totalRevenue">-</div>
                <div class="sub" id="todayRevenue"></div>
            </div>
        </div>

        <div class="period-toggle">
            <button class="period-btn active" data-period="daily">일일</button>
            <button class="period-btn" data-period="monthly">월별</button>
            <button class="period-btn" data-period="yearly">연도별</button>
        </div>

        <div class="chart-container">
            <h3>가입자 & 매칭</h3>
            <canvas id="signupMatchChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>수익</h3>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>게시글</h3>
            <canvas id="postChart"></canvas>
        </div>
    </div>
</div>

<footer class="footer"><p>&copy; 2026 Pet Mate Admin</p></footer>

<script>
let signupMatchChart, revenueChart, postChart;
let currentPeriod = 'daily';

async function checkAdmin() {
    try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (!data.loggedIn) { location.href = '/admin-login.html'; return false; }
        document.getElementById('adminName').textContent = data.adminName + ' 관리자';
        return true;
    } catch(e) { location.href = '/admin-login.html'; return false; }
}

async function adminLogout() {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.href = '/admin-login.html';
}

async function loadStats() {
    const res = await fetch('/api/admin/stats');
    const s = await res.json();
    document.getElementById('totalUsers').textContent = s.totalUsers.toLocaleString();
    document.getElementById('todaySignups').textContent = s.todaySignups.toLocaleString();
    document.getElementById('todayMatches').textContent = s.todayMatches.toLocaleString();
    document.getElementById('totalRevenue').textContent = s.totalRevenue.toLocaleString() + '원';
    document.getElementById('todayRevenue').textContent = '오늘 +' + s.todayRevenue.toLocaleString() + '원';
}

async function loadCharts(period) {
    const res = await fetch('/api/admin/chart?period=' + period);
    const d = await res.json();

    const commonOpts = {
        responsive: true,
        plugins: { legend: { labels: { font: { family: 'Pretendard' } } } },
        scales: { y: { beginAtZero: true } }
    };

    if (signupMatchChart) signupMatchChart.destroy();
    signupMatchChart = new Chart(document.getElementById('signupMatchChart'), {
        type: 'line',
        data: {
            labels: d.labels,
            datasets: [
                { label: '가입자', data: d.signups, borderColor: '#B8956A', backgroundColor: 'rgba(184,149,106,0.1)', tension: 0.3, fill: true },
                { label: '매칭', data: d.matches, borderColor: '#D4A574', backgroundColor: 'rgba(212,165,116,0.1)', tension: 0.3, fill: true }
            ]
        },
        options: commonOpts
    });

    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
        type: 'bar',
        data: {
            labels: d.labels,
            datasets: [{ label: '수익 (원)', data: d.revenue, backgroundColor: '#B8956A', borderRadius: 6 }]
        },
        options: commonOpts
    });

    if (postChart) postChart.destroy();
    postChart = new Chart(document.getElementById('postChart'), {
        type: 'line',
        data: {
            labels: d.labels,
            datasets: [{ label: '게시글', data: d.posts, borderColor: '#5a4a3a', backgroundColor: 'rgba(90,74,58,0.1)', tension: 0.3, fill: true }]
        },
        options: commonOpts
    });
}

document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentPeriod = this.dataset.period;
        loadCharts(currentPeriod);
    });
});

(async () => {
    if (await checkAdmin()) {
        loadStats();
        loadCharts('daily');
    }
})();
</script>
</body>
</html>
